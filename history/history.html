<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LoginGuard - Scan History</title>
  <link rel="stylesheet" href="history.css">
</head>
<body>
  <div class="history-container">
    <!-- Header -->
    <header class="history-header">
      <div class="header-brand">
        <div class="brand-shield">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            <path d="M12 8v4"/>
            <path d="M12 16h.01"/>
          </svg>
        </div>
        <div>
          <h1>Scan History</h1>
          <p class="subtitle">Log of audited login domains and threat verdicts</p>
        </div>
      </div>
      <div class="header-actions">
        <button id="btn-export-json" class="btn btn-secondary">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          Export JSON
        </button>
        <button id="btn-clear-all" class="btn btn-danger">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          </svg>
          Clear All History
        </button>
      </div>
    </header>

    <!-- Controls Bar: Filter tabs & Search -->
    <div class="controls-bar">
      <div class="filter-tabs">
        <button class="filter-tab active" data-filter="ALL">All (<span id="count-all">0</span>)</button>
        <button class="filter-tab" data-filter="SAFE">Safe (<span id="count-safe">0</span>)</button>
        <button class="filter-tab" data-filter="SUSPICIOUS">Suspicious (<span id="count-suspicious">0</span>)</button>
        <button class="filter-tab" data-filter="DANGEROUS">Dangerous (<span id="count-dangerous">0</span>)</button>
      </div>
      <div class="search-box">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="search-input" placeholder="Search by domain name...">
      </div>
    </div>

    <!-- History List / Table -->
    <main class="history-content">
      <div id="history-list" class="history-list">
        <!-- Rendered items go here -->
      </div>

      <div id="empty-history" class="empty-placeholder" style="display: none;">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="1.8">
          <circle cx="12" cy="12" r="10"></circle>
          <polyline points="12 6 12 12 16 14"></polyline>
        </svg>
        <h3>No Scan History Found</h3>
        <p>LoginGuard records domain analysis whenever you visit a page with a login field.</p>
      </div>
    </main>

    <!-- Footer -->
    <footer class="history-footer">
      <span id="history-total-info">Total records: 0 / 1000 max</span>
      <span class="privacy-note">Privacy First: Zero passwords or form credentials are ever recorded.</span>
    </footer>
  </div>

  <script src="history.js" type="module"></script>
</body>
</html>
